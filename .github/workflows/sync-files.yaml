name: sync-files

on:
  workflow_dispatch:

jobs:
  sync-files:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run sync-files
        uses: autowarefoundation/autoware-github-actions/sync-files@v1
        with:
          token: ${{ github.token }}
          pr-labels: |
            tag:bot
            tag:sync-files
